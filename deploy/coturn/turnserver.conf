# Coturn STUN / TURN configuration for Parental Control WebRTC Streaming
listening-port=3478
tls-listening-port=5349

# Listening IP addresses (0.0.0.0 listens on all interfaces)
listening-ip=0.0.0.0

# External relay IP - the host machine IP where Docker is running
external-ip=192.168.1.110

# Min and Max relay ports for media traffic
min-port=49152
max-port=49155

# Authentication method: Long-term credential mechanism
lt-cred-mech
user=parentalctl:SecureTurnSecretPass2026

# Realm definition
realm=turn.parentalcontrol.local

# Security hardening
no-tls=0
no-dtls=0
stale-nonce=600
fingerprint
mobility
no-cli
verbose
allow-loopback-peers
